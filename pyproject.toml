[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "full-bianchi-hyrec"
version = "0.47.0"
description = "Research implementation and durable artifacts for scalar Full Bianchi–HyRec"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.15",
]

[project.optional-dependencies]
test = ["pytest>=8", "mpmath>=1.3"]
research = ["mpmath>=1.3", "pandas>=2.2", "jax>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long scientific regression requiring minutes to hours"]
