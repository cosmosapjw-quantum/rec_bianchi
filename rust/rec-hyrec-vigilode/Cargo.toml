[package]
name = "rec-hyrec-vigilode"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
build = "build.rs"

# This is an independent package; the parent owns the pinned source workspace.
[workspace]

[dependencies]
rodas5p-core = { path = "../vendor-vigilode-a21d573/crates/rodas5p-core" }
rodas5p-integrators = { path = "../vendor-vigilode-a21d573/crates/rodas5p-integrators" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = false
strip = "debuginfo"
panic = "abort"
