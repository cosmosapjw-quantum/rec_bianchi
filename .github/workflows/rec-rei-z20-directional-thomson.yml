name: REC REI original z20 local Thomson clock source audit
on:
  push:
    branches:
      - research/rec-rei-z20-directional-thomson-consumer-20261101
  pull_request:
    paths:
      - 'research/rec_rei_z20_local_thomson_consumer_20261101/**'
      - '.github/workflows/rec-rei-z20-directional-thomson.yml'
jobs:
  original-source-local-clock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/rec_rei_z20_local_thomson_consumer_20261101
            research/rec_rei_hyrec_primordial_screen_20261101
            research/rec_r3c_rei_bridge_20261015
          sparse-checkout-cone-mode: true
      - name: Original native-C saved-output source contracts
        run: python3 -m unittest discover -s research/rec_rei_hyrec_primordial_screen_20261101/tests -v
      - name: New physical z20 clock contracts
        run: python3 -m unittest discover -s research/rec_rei_z20_local_thomson_consumer_20261101/tests -v
      - name: Check optimized source and new code contracts
        run: |
          python3 -O -m unittest discover -s research/rec_rei_hyrec_primordial_screen_20261101/tests -v
          python3 -O -m unittest discover -s research/rec_rei_z20_local_thomson_consumer_20261101/tests -v
      - name: Recompute exact source-conditioned output
        run: |
          python3 research/rec_rei_z20_local_thomson_consumer_20261101/z20_local_receiver.py --repo . --out /tmp/rec-rei-z20-local-output
          cmp /tmp/rec-rei-z20-local-output/REC_REI_Z20_LOCAL_RAY_CLOCK_OPACITY.csv research/rec_rei_z20_local_thomson_consumer_20261101/results/REC_REI_Z20_LOCAL_RAY_CLOCK_OPACITY.csv
          cmp /tmp/rec-rei-z20-local-output/SCIENCE_STATUS.json research/rec_rei_z20_local_thomson_consumer_20261101/results/SCIENCE_STATUS.json
      - name: Preserve byte-verified source and physical results
        uses: actions/upload-artifact@v4
        with:
          name: rec-rei-z20-local-source-and-results
          if-no-files-found: error
          path: |
            research/rec_r3c_rei_bridge_20261015/HYREC_FLRW_Z20_TO_1600.csv
            research/rec_r3c_rei_bridge_20261015/HYREC_ORIGINAL_REI_MATCHED_STDOUT.gz
            research/rec_r3c_rei_bridge_20261015/REI_CONDITIONAL_BOUNDARY.json
            research/rec_r3c_rei_bridge_20261015/SHEAR_BACK_EXTRAPOLATION.json
            research/rec_rei_hyrec_primordial_screen_20261101/original_hyrec_screen.py
            research/rec_rei_z20_local_thomson_consumer_20261101/
