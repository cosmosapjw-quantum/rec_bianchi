name: rec-next03-import-julia-manifest

on:
  push:
    branches:
      - audit/rec-next03-octave-jas-julia-cas-20260903-r1

permissions:
  contents: write

jobs:
  import-exact-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Import exact accepted Manifest.toml and remove this one-shot workflow
        run: |
          set -euo pipefail
          git fetch --depth=1 origin audit/rec-next03-julia-manifest-capture-20260903-r1
          git checkout FETCH_HEAD -- formal/rec_next03/external_cas_oji/julia/Manifest.toml
          printf '%s  %s\n' \
            'e5eaab5c224dddd81c02e5fc798f1d631e6f71be1adf3c1c974bafa07d88e5bf' \
            'formal/rec_next03/external_cas_oji/julia/Manifest.toml' | sha256sum --check --strict
          git rm .github/workflows/rec-next03-import-julia-manifest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formal/rec_next03/external_cas_oji/julia/Manifest.toml
          git commit -m 'build(rec-next03): import immutable Julia manifest [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
