name: verify-durable-backup
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # verify_repo runs the committed-range whitespace gate, which needs a
          # base commit to bound the range. The default depth-1 checkout has no
          # history at all, so no base resolves and the gate errors out.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Smoke-import every package module from the committed tree
        run: python scripts/check_imports.py
      - run: python scripts/verify_repo.py --quick
      - run: pytest -q
