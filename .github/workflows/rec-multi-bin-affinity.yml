name: REC multi-bin affinity research
on:
  push:
    branches: [research/rec-multi-bin-affinity-20260907-r1]
    paths:
      - 'docs/research/rec_multi_bin_affinity_20260907/*.py'
      - '.github/workflows/rec-multi-bin-affinity.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 격리 연구 환경
        run: |
          python -m venv "$RUNNER_TEMP/rec-multibin-venv"
          "$RUNNER_TEMP/rec-multibin-venv/bin/python" -m pip install numpy==2.2.6 scipy==1.15.3 sympy==1.14.0 mpmath==1.3.0 matplotlib==3.10.3
      - name: 원본 2s 표와 제조 격자의 합성 검증
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MPLCONFIGDIR: ${{ runner.temp }}/rec-multibin-mpl
        run: |
          git diff --check HEAD^ HEAD
          "$RUNNER_TEMP/rec-multibin-venv/bin/python" -B docs/research/rec_multi_bin_affinity_20260907/run_study.py --out "$RUNNER_TEMP/rec-multibin-result"
      - name: 실패 포함 원본 결과 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rec-multi-bin-${{ github.sha }}
          path: ${{ runner.temp }}/rec-multibin-result
          retention-days: 30
          if-no-files-found: warn
