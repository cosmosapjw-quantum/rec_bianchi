name: rec-physical-donor-angular-audit

on:
  push:
    branches:
      - research/rec-physical-donor-angular-basis-audit-20260903-r1
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded contract dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Require the research contract before implementation
        run: python -m pytest -q tests/research/test_rec_physical_donor_angular_audit.py
