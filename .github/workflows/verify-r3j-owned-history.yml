name: verify-r3j-owned-history
on:
  push:
    branches: [research/rec-r3j-u6-owned-history-20261018]
permissions:
  contents: read
concurrency:
  group: r3j-owned-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Focused equivalence tests
        id: tests
        run: |
          mkdir -p delivery
          set -o pipefail
          python -m pytest -q tests/trajectory/test_owned_flrw_history.py tests/trajectory/test_primordial_2012_refined_u6_rt_boundary.py --junitxml=delivery/pytest.xml 2>&1 | tee delivery/pytest.log
      - name: Preserve exact tracked source and result status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p delivery
          git archive --format=tar HEAD | gzip -n > delivery/REC_R3J_SOURCE_TREE.tar.gz
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          folder=Path('delivery')
          files={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in folder.iterdir() if p.is_file()}
          manifest={'schema':'rec.r3j.ci-source-receipt.v1','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'test_outcome':os.environ['TEST_OUTCOME'],'python':sys.version,'execution_environment':'GitHub Actions, not ChatGPT sandbox or NCP','files':files,'scientific_scope':'gather and synthetic recurrence equivalence only; actual U5 checkpoint and full U6 not executed'}
          (folder/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REC_R3J_TESTED_SOURCE_${{ github.sha }}
          path: delivery/
          retention-days: 30
