name: REC available components only
on:
  push:
    branches:
      - research/rec-modeb-original-runtime-20260906-r1
    paths:
      - docs/research/rec_modeb_original_runtime/check_rec_available.py
      - .github/workflows/rec-modeb-available-components.yml
permissions:
  contents: read
jobs:
  rec-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 전용 REC 진단 환경
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rec-available"
          python -m venv "$RUNNER_TEMP/rec-available-venv"
          "$RUNNER_TEMP/rec-available-venv/bin/python" -m pip install numpy==2.2.6 scipy==1.15.3 sympy==1.14.0 mpmath==1.3.0
      - name: BASS 원본 실행과 구분한 REC 검사
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/rec-available-venv/bin/python" -B docs/research/rec_modeb_original_runtime/check_rec_available.py --out "$RUNNER_TEMP/rec-available"
      - name: 실제 부분 결과 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rec-available-components-${{ github.sha }}
          path: ${{ runner.temp }}/rec-available
          if-no-files-found: warn
          retention-days: 30
