name: rec-2s-o2o3-research
on:
  push:
    branches:
      - research/rec-2s-o2o3-counting-reference-20260905-r1
    paths:
      - docs/research/rec_2s_o2o3_counting_reference/verify_o2o3.py
      - .github/workflows/rec-2s-o2o3-research.yml
permissions:
  contents: read
jobs:
  conditional-formulas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separate research environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rec-o2o3-venv"
          "$RUNNER_TEMP/rec-o2o3-venv/bin/python" -m pip install sympy==1.14.0 mpmath==1.3.0 matplotlib==3.10.3
      - name: Conditional algebra and finite numerical probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rec-o2o3-result"
          export MPLCONFIGDIR="$RUNNER_TEMP/rec-o2o3-mpl"
          export PYTHONDONTWRITEBYTECODE=1
          "$RUNNER_TEMP/rec-o2o3-venv/bin/python" -B docs/research/rec_2s_o2o3_counting_reference/verify_o2o3.py --out "$RUNNER_TEMP/rec-o2o3-result" 2>&1 | tee "$RUNNER_TEMP/rec-o2o3-result/EXECUTION.log"
          cd "$RUNNER_TEMP/rec-o2o3-result"
          sha256sum RESULT.json FORWARD_FRACTION.csv FORWARD_FRACTION.png FORWARD_FRACTION.svg EXECUTION.log > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec-2s-o2o3-research
          path: ${{ runner.temp }}/rec-o2o3-result
          if-no-files-found: warn
          retention-days: 30
