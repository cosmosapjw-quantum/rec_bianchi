name: verify-r3s-ncp-campaign

on:
  push:
    paths:
      - 'scripts/*r3s*.py'
      - 'tests/test_r3s*.py'
      - 'research/rec_r3s_ncp_campaign_20261021/CAMPAIGN.json'
      - 'research/rec_r3s_ncp_campaign_20261021/validation/*.py'
      - '.github/workflows/verify-r3s-ncp-campaign.yml'
  pull_request:
    paths:
      - 'scripts/*r3s*.py'
      - 'tests/test_r3s*.py'
      - 'research/rec_r3s_ncp_campaign_20261021/CAMPAIGN.json'
      - 'research/rec_r3s_ncp_campaign_20261021/validation/*.py'
      - '.github/workflows/verify-r3s-ncp-campaign.yml'
  workflow_dispatch:

jobs:
  bounded-campaign-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared test dependencies
        run: python -m pip install -e '.[test]'
      - name: Fixed-source bounded scheduler contracts; no REC integration
        run: |
          python -B research/rec_r3s_ncp_campaign_20261021/validation/run_local_validation.py \
            --expected-commit "$(git rev-parse HEAD)" \
            --allocation-id "REC_R3S_LOCAL_VALIDATION_CI_${{ github.run_id }}_${{ github.run_attempt }}" \
            --output "$RUNNER_TEMP/r3s-validation-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve command, source, raw output and resource receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3s-tests-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/r3s-validation-${{ github.run_id }}-${{ github.run_attempt }}
