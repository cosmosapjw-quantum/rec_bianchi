name: REC F05 original accepted CMB Compton energy source science
on:
  push:
    branches:
      - research/rec-f05-native-compton-energy-20261101
  pull_request:
    paths:
      - "research/rec_f05_compton_exchange_20261101/**"
      - ".github/workflows/rec-f05-compton-energy.yml"
jobs:
  original-source-compton-physics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/rec_rei_f05_accepted_history_thomson_20261101
            research/rec_rei_f05_native_thomson_medium_20261101
            research/rec_f05_rust_native_20261101
            research/rec_f05_compton_exchange_20261101
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific array decoder
        run: python -m pip install numpy==2.1.3
      - name: Run original-source physics unit tests
        run: |
          python -m unittest discover -v -s research/rec_f05_compton_exchange_20261101 -p test_compton.py
          python -O -m unittest discover -v -s research/rec_f05_compton_exchange_20261101 -p test_compton.py
      - name: Recompute original 46080 source cells and test physical summary
        run: |
          python research/rec_f05_compton_exchange_20261101/compute_compton.py --repo . --out "$RUNNER_TEMP/rec194_compton"
          python - "$RUNNER_TEMP/rec194_compton/SCIENCE_RESULT.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["source_cells"]==46080 and d["original_accepted_tick"]==160
          assert all(x<0 for x in d["Compton_Q_erg_s_enclosure"])
          assert 1.5e-7 < d["frozen_one_tick_kinetic_energy_fraction_enclosure"][0] < 1.6e-7
          print("Source-locked original Compton science conditional PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rec194-original-F05-compton-physics
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rec194_compton/
            research/rec_f05_compton_exchange_20261101/THEORY.md
            research/rec_f05_compton_exchange_20261101/SCIENTIFIC_REPORT.md
