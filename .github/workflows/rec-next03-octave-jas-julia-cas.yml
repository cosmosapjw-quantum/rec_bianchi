name: rec-next03-julia-manifest-capture

on:
  push:
    branches:
      - audit/rec-next03-julia-manifest-capture-20260903-r1

permissions:
  contents: write

jobs:
  capture-julia-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.7'
      - name: Resolve exact Julia manifest
        run: |
          julia --project=formal/rec_next03/external_cas_oji/julia -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
          sha256sum formal/rec_next03/external_cas_oji/julia/Project.toml formal/rec_next03/external_cas_oji/julia/Manifest.toml
      - name: Commit captured manifest to disposable branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formal/rec_next03/external_cas_oji/julia/Project.toml formal/rec_next03/external_cas_oji/julia/Manifest.toml
          if git diff --cached --quiet; then
            echo 'No generated environment change to commit.'
          else
            git commit -m 'chore(rec-next03): materialize Julia manifest [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
