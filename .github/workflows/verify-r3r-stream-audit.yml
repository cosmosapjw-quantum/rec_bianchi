name: verify-r3r-stream-audit

on:
  push:
    paths:
      - 'scripts/*r3r*.py'
      - 'tests/test_r3r*.py'
      - 'tests/fixtures/r3r_actual32/**'
      - '.github/workflows/verify-r3r-stream-audit.yml'
  pull_request:
    paths:
      - 'scripts/*r3r*.py'
      - 'tests/test_r3r*.py'
      - 'tests/fixtures/r3r_actual32/**'
      - '.github/workflows/verify-r3r-stream-audit.yml'
  workflow_dispatch:

jobs:
  differential-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared test dependencies
        run: python -m pip install -e '.[test]'
      - name: Saved-stream, adversarial and resource-binding regressions
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_r3r_stream_audit.py tests/test_r3r_supervised.py --junitxml=r3r-tests.xml
      - name: Preserve exact run identity and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3r-tests-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          path: r3r-tests.xml

